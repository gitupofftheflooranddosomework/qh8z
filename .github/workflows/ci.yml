name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qh8z
          POSTGRES_PASSWORD: qh8z
          POSTGRES_DB: qh8z_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qh8z -d qh8z_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QH8Z_TEST_DATABASE_URL: postgres://qh8z:qh8z@localhost:5432/qh8z_test?sslmode=disable
      QH8Z_DOMAIN: qh8z.example.com
      ACME_EMAIL: ci@example.com
      SMTP_ADDR: smtp.example.com:587
      SMTP_HOST: smtp.example.com
      SMTP_USERNAME: ci
      SMTP_FROM: qh8z-ci@example.com
      STRIPE_PRO_PRICE_ID: price_ci
      RESTIC_REPOSITORY: s3:https://storage.example.com/qh8z-ci
      QH8Z_SECRETS_DIR: ${{ github.workspace }}/.ci-secrets
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verify module files
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/qh8z ./cmd/healthcheck ./cmd/loadtest
      - name: Validate development Compose
        run: docker compose config --quiet
      - name: Build application container
        run: docker build -t qh8z:ci .
      - name: Prepare production config fixtures
        run: |
          mkdir -p "$QH8Z_SECRETS_DIR"
          for secret in postgres_password smtp_password webrisk_api_key admin_token rate_limit_salt stripe_secret_key stripe_webhook_secret restic_password restic_s3_access_key restic_s3_secret_key alertmanager_discord_webhook; do
            printf 'ci-placeholder-%s-abcdefghijklmnopqrstuvwxyz0123456789\n' "$secret" > "$QH8Z_SECRETS_DIR/$secret"
          done
          chmod 600 "$QH8Z_SECRETS_DIR"/*
      - name: Validate production Compose
        run: docker compose -f deploy/compose.production.yml config --quiet
      - name: Validate Caddy config
        run: |
          docker run --rm \
            -e ACME_EMAIL \
            -e QH8Z_DOMAIN \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate Prometheus config and alerts
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus:v3.13.1 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus:v3.13.1 \
            check rules /etc/prometheus/alerts.yml
      - name: Validate Alertmanager config
        run: |
          docker run --rm \
            --entrypoint /bin/amtool \
            -v "$PWD/deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            -v "$QH8Z_SECRETS_DIR/alertmanager_discord_webhook:/run/secrets/alertmanager_discord_webhook:ro" \
            prom/alertmanager:v0.32.1 \
            check-config /etc/alertmanager/alertmanager.yml
      - name: Validate operations scripts
        run: |
          sh -n deploy/init-secrets.sh
          sh -n deploy/failure-test.sh
          sh -n deploy/backup/backup.sh
          sh -n deploy/backup/restore.sh
      - name: Build backup container
        run: docker build -t qh8z-backup:ci deploy/backup
