name: Security Audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Build production-owned images
        run: |
          docker build -t qh8z:security .
          docker build -t qh8z-backup:security deploy/backup

      - name: Pull pinned production images
        run: |
          docker pull caddy:2.11.4-alpine
          docker pull postgres:17-alpine
          docker pull prom/prometheus:v3.13.1
          docker pull prom/alertmanager:v0.32.1

      - name: Scan production images for fixable high or critical vulnerabilities
        run: |
          mkdir -p .trivy-cache
          scan_image() {
            image="$1"
            echo "Scanning $image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivy-cache:/root/.cache" \
              aquasec/trivy:0.73.0 image \
              --quiet \
              --exit-code 1 \
              --ignore-unfixed \
              --severity HIGH,CRITICAL \
              "$image"
          }
          scan_image qh8z:security
          scan_image qh8z-backup:security
          scan_image caddy:2.11.4-alpine
          scan_image postgres:17-alpine
          scan_image prom/prometheus:v3.13.1
          scan_image prom/alertmanager:v0.32.1
